// 安卓 App 模块：APK 用的就是 public/ 里那套界面，assets 由 Gradle 在构建时同步过去
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------- 版本号（单一来源）
// 以前写死 versionCode 1 / versionName '1.0.0'：每次发版 APK 都自称 1.0.0，
// 覆盖安装时系统可能按"同版本/降级"处理。现在从仓库根 package.json 推导：
//   1.1.0 → versionName 1.1.0 / versionCode 10100（major*10000 + minor*100 + patch）
def pkgJson = new JsonSlurper().parseText(file("${rootDir}/../package.json").text)
def gwVersionName = pkgJson.version.toString()
def versionMatcher = gwVersionName =~ /^(\d+)\.(\d+)\.(\d+)/
def gwVersionCode = versionMatcher.matches()
    ? (versionMatcher.group(1) as int) * 10000 + (versionMatcher.group(2) as int) * 100 + (versionMatcher.group(3) as int)
    : 1

// ---------------------------------------------------------------- 稳定签名
// 优先级：环境变量（CI Secrets）> android/keystore.properties（本地，已 gitignore）> debug 签名。
// 背景：release 以前直接复用 debug 签名，而 CI runner 每次都是干净的 ~/.android，
// AGP 会重新生成 debug.keystore —— 于是每个 release 的签名都不一样，装过旧版的机器
// 一律报"签名不一致，无法覆盖安装"。
def keystoreProps = new Properties()
// 根工程是 android/，CI 与本地都写 android/keystore.properties；
// 同时兼容历史上放在 android/app/ 的写法。
def keystorePropsFile = rootProject.file('keystore.properties')
if (!keystorePropsFile.exists()) keystorePropsFile = file("${projectDir}/keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def readSetting = { String propKey, String envName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && !fromEnv.isEmpty()) return fromEnv
    def fromFile = keystoreProps.getProperty(propKey)
    return (fromFile != null && !fromFile.isEmpty()) ? fromFile : null
}
def stableStorePath = readSetting('storeFile', 'ANDROID_KEYSTORE_PATH')
def stableStorePass = readSetting('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def stableKeyAlias = readSetting('keyAlias', 'ANDROID_KEY_ALIAS')
def stableKeyPass = readSetting('keyPassword', 'ANDROID_KEY_PASSWORD')
def hasStableKey = stableStorePath != null && stableStorePass != null && stableKeyAlias != null

android {
    namespace 'com.guw.watch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.guw.watch'
        minSdk 24
        targetSdk 34
        versionCode = gwVersionCode
        versionName = gwVersionName
    }

    signingConfigs {
        if (hasStableKey) {
            release {
                storeFile = file(stableStorePath)
                storePassword = stableStorePass
                keyAlias = stableKeyAlias
                keyPassword = (stableKeyPass != null ? stableKeyPass : stableStorePass)
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            // 有固定密钥就用它；否则退回 debug（本地开发仍可用，但 CI 发版必须配 Secrets）
            signingConfig = hasStableKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 仓库里不重复存一份网页代码：构建前由 tools/sync-android-assets.mjs 把 ../public
    // 同步进 src/main/assets/www（.gitignore 已忽略该目录）。
    // 刻意不在 Gradle 里做这个拷贝：往 sourceSets 源码目录写文件会触发 Gradle 8.x
    // 的任务依赖校验，导致 lintVitalRelease 直接失败（踩过）。
    sourceSets {
        main {
            assets.srcDirs = ["$projectDir/src/main/assets"]
        }
    }
}

def webAssets = file("${projectDir}/src/main/assets/www")

// 提前失败并给出人话提示，而不是打出一个没有界面的 APK
tasks.register('checkWebAssets') {
    doFirst {
        if (!file("${webAssets}/index.html").exists()) {
            throw new GradleException("assets/www 是空的：先跑 `node tools/sync-android-assets.mjs` 再构建（CI 里由 workflow 负责）")
        }
    }
}

tasks.named('preBuild') { dependsOn 'checkWebAssets' }

// 构建时把实际使用的版本/签名来源打到日志里，避免"以为换成固定 key 了其实没换"。
// 用 matching().configureEach 而不是 tasks.named()：AGP 的 assemble* 任务在配置期后段才注册，
// 直接 named() 会抛 UnknownTaskException（这次 CI 挂掉的原因之一）。
tasks.register('printSigningInfo') {
    doLast {
        println "GUW_VERSION name=${gwVersionName} code=${gwVersionCode}"
        println(hasStableKey
            ? "GUW_SIGNING stable (${stableStorePath}, alias=${stableKeyAlias})"
            : "GUW_SIGNING debug-fallback（未配置 ANDROID_KEYSTORE_PATH / keystore.properties）")
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { dependsOn 'printSigningInfo' }

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'   // FileProvider（应用内更新安装 APK）
}
