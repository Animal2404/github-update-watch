name: build-android

# 安卓 APK：完全在 GitHub 云端编译，并跑一次模拟器冒烟测试（装上、启动、截图、确认没崩）。
# APK 里的界面就是仓库里的 public/（由 android/app/build.gradle 的 syncWebAssets 同步进 assets），
# 所以手机版和电脑版是同一份前端 + 同一份 github-core.js。

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

jobs:
  apk:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不调 android-actions/setup-android：它会去装已废弃的 'tools' 包然后失败
      # （实测 "Failed to find package 'tools'"）。ubuntu-latest 镜像自带 Android SDK
      # 且许可已接受，Gradle 通过 ANDROID_HOME 就能找到。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步网页资源进 APK
        run: node tools/sync-android-assets.mjs

      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
          ls "$ANDROID_HOME/build-tools" | tail -5

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 配置签名（有 Secrets 才用固定 key）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 注意：step 级 env 只对当前 step 生效，不会传给后面的 Gradle 步骤。
          # 所以这里把四个值直接落成 android/keystore.properties（Gradle 会读），
          # 而不是只往 $GITHUB_ENV 写一个 PATH —— 上次就是这么"看起来配了、其实没生效"。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guw-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/guw-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
            echo "签名：使用仓库 Secrets 里的固定 release key（已写入 android/keystore.properties）"
          else
            echo "::warning title=签名回退::未配置 ANDROID_KEYSTORE_BASE64，本次仍用 debug 签名；每次构建签名都不同，装过旧版的设备无法覆盖安装"
          fi
      - name: 核对签名配置确实生效
        run: |
          if [ -f android/keystore.properties ]; then
            grep -q '^storeFile=' android/keystore.properties && echo "keystore.properties 已就绪"
          else
            echo "keystore.properties 不存在（将回退 debug）"
          fi

      - name: 编译 debug 与 release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: 失败时把 Gradle 错误写进摘要
        if: failure()
        run: |
          {
            echo '### Gradle 构建失败（末尾 80 行）'
            echo '```'
            tail -n 80 "$RUNNER_TEMP/gradle-build.log" 2>/dev/null || echo '(没有日志文件)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 打印 APK 签名指纹（升级前核对用）
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ] && [ -n "$APK" ]; then
            {
              echo '### APK 签名指纹'
              echo '```'
              "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "拿不到 apksigner 或 APK，跳过指纹输出"
          fi

      - name: 校验 APK 内确实打进了网页资源
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "检查 $APK"
          unzip -l "$APK" | tee apk-contents.txt | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/github-core.js'
          unzip -l "$APK" | grep -q 'assets/www/vendor/morphicons/dom.js'
          unzip -l "$APK" | grep -q 'assets/www/styles.css'
          echo "网页资源已打进 APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 记录 APK 体积
        run: ls -lh android/app/build/outputs/apk/*/*.apk

  smoke:
    name: 模拟器冒烟（装上并启动）
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 找出 APK 路径
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "找到 $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 打开 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器安装并启动 App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # 只能是单行：这个 action 把 script 逐行交给 sh -c，多行 if/fi 会被拆断
          script: bash tools/android-smoke.sh "$APK_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-shot
          path: |
            app.png
            logcat.txt
          if-no-files-found: warn
