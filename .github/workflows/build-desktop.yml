name: build-desktop

# Windows 桌面版：Electron 外壳 + 仓库里的 server.mjs 与 public/，在云端打出安装包与免安装版。
# 桌面版没有另写界面——用的是同一份网页与同一份 github-core.js。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: 打包 Windows 安装包 / 免安装版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: 打包（nsis 安装包 + portable 免安装）
        run: npm run dist

      - name: 列出产物
        run: Get-ChildItem dist | Format-Table Name, Length
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  smoke-linux:
    name: Electron 冒烟（云端把壳跑起来）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: Electron 运行所需图形库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libxss1 \
            || sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1

      - name: 起壳并等界面渲染（无头）
        # --no-sandbox：CI 上 Electron 的 chrome-sandbox 没有 4755/root 属主，不加会直接 abort
        run: xvfb-run -a npx electron . --smoke --no-sandbox
