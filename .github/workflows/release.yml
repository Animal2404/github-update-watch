name: release

# 打一个 v* 标签就自动：云端编译 Windows 安装包 / 免安装版 / 安卓 APK，
# 然后把三个文件挂到这个 tag 的 GitHub Release 上。
# 这样别人（和未来的你）直接从 Releases 页面就能下载，不用去翻 Actions artifacts。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.0，必须先存在）'
        required: true

permissions:
  contents: write   # 创建 Release 需要写权限

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: 云端编译 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步网页资源进 APK
        run: node tools/sync-android-assets.mjs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 配置签名（有 Secrets 才用固定 key）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 注意：step 级 env 只对当前 step 生效，不会传给后面的 Gradle 步骤。
          # 所以这里把四个值直接落成 android/keystore.properties（Gradle 会读），
          # 而不是只往 $GITHUB_ENV 写一个 PATH —— 上次就是这么"看起来配了、其实没生效"。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guw-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/guw-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
            echo "签名：使用仓库 Secrets 里的固定 release key（已写入 android/keystore.properties）"
          else
            echo "::warning title=签名回退::未配置 ANDROID_KEYSTORE_BASE64，本次仍用 debug 签名；每次构建签名都不同，装过旧版的设备无法覆盖安装"
          fi
      - name: 核对签名配置确实生效
        run: |
          if [ -f android/keystore.properties ]; then
            grep -q '^storeFile=' android/keystore.properties && echo "keystore.properties 已就绪"
          else
            echo "keystore.properties 不存在（将回退 debug）"
          fi

      - name: 编译 release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: 失败时把 Gradle 错误写进摘要
        if: failure()
        run: |
          {
            echo '### Gradle 构建失败（末尾 80 行）'
            echo '```'
            tail -n 80 "$RUNNER_TEMP/gradle-build.log" 2>/dev/null || echo '(没有日志文件)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时输出可读的编译错误（公开 annotation，免登录诊断）
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          if [ -f "$LOG" ]; then
            grep -nE "(^e: |error:|FAILURE:|What went wrong|Caused by:)" "$LOG" | head -n 40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '%' | cut -c1-400)
              echo "::error title=Gradle 编译错误::$clean"
            done
          fi
      - name: 打印 APK 签名指纹（升级前核对用）
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ] && [ -n "$APK" ]; then
            {
              echo '### APK 签名指纹'
              echo '```'
              "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "拿不到 apksigner 或 APK，跳过指纹输出"
          fi

      - name: 守卫 APK（资源 / 体积 / 固定签名）并生成 sha256
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/app.js'
          unzip -l "$APK" | grep -q 'assets/www/github-core.js'
          unzip -l "$APK" | grep -q 'assets/www/subs-core.js'
          SIZE=$(stat -c%s "$APK")
          echo "APK 体积：$SIZE bytes"
          test "$SIZE" -gt 200000
          mkdir -p out
          cp "$APK" "out/GitHubUpdateWatch-${VERSION}.apk"
          sha256sum "out/GitHubUpdateWatch-${VERSION}.apk" | awk '{print $1}' > "out/GitHubUpdateWatch-${VERSION}.apk.sha256"
          if [ -f android/keystore.properties ]; then
            CERT=$(node tools/apk-cert.mjs "$APK")
            echo "cert=$CERT"
            if [ "$CERT" != "B1:E8:30:62:DC:81:F2:91:24:F8:2E:86:82:B7:31:FE:27:A6:DB:FD:71:1C:29:AE:93:25:9C:CC:79:CC:B5:EB" ]; then
              echo "::error title=签名不一致::APK 证书 $CERT ≠ 固定证书 B1:E8:30:62:DC:81:F2:91:24:F8:2E:86:82:B7:31:FE:27:A6:DB:FD:71:1C:29:AE:93:25:9C:CC:79:CC:B5:EB"
              exit 1
            fi
          fi
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            out/*.apk
            out/*.sha256
          if-no-files-found: error

  desktop:
    name: 云端打包 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查 package.json 没有 BOM
        shell: pwsh
        run: |
          # 踩过：用 PowerShell 的 Set-Content 改版本号会写入 BOM，
          # electron-builder 直接 "readObjectStart: expect { or n, but found ?" 挂掉。
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\package.json")
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error 'package.json 带 UTF-8 BOM，electron-builder 读不了'
            exit 1
          }
          Write-Output 'package.json 无 BOM'

      - name: 检查版本号一致（package.json ↔ public/version.js）
        run: node tools/bump-version.mjs --check

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: 打包（安装包 + 免安装版）
        run: npm run dist

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: 校验打包内容（EXE 里确实带着界面与服务）
        shell: pwsh
        run: |
          # asar 已关闭（asar:false）——Node 的 ESM 加载器不认 asar 归档，
          # 而桌面壳要 import server.mjs，所以直接把文件摊开更稳。
          $appDir = 'dist\win-unpacked\resources\app'
          if (-not (Test-Path $appDir)) { Write-Error "找不到 $appDir"; exit 1 }
          $missing = @()
          foreach ($f in @('public\index.html', 'public\github-core.js', 'public\vendor\morphicons\dom.js', 'public\vendor\icons.js', 'server.mjs', 'electron\main.mjs')) {
            if (-not (Test-Path (Join-Path $appDir $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) { Write-Error "打包内容缺少: $($missing -join ', ')"; exit 1 }
          Write-Output "Windows 包内容校验通过（界面 + 共享核心 + 服务 + 桌面壳都在）"

      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: 免安装版冒烟（真跑一遍 Portable exe）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist -Filter '*Portable*.exe' | Select-Object -First 1).FullName
          Write-Output "启动 $exe"
          $env:GUW_SMOKE_OUT = "$PWD\smoke-portable.json"
          if (Test-Path $env:GUW_SMOKE_OUT) { Remove-Item $env:GUW_SMOKE_OUT }
          # 便携版是「自解压 + 分离启动」，这条命令会立刻返回，所以要轮询结果文件
          & $exe --smoke
          Write-Output "启动器返回码 = $LASTEXITCODE"
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $env:GUW_SMOKE_OUT) {
              $raw = Get-Content $env:GUW_SMOKE_OUT -Raw
              Write-Output "结果: $raw"
              if ($raw -match '"phase"') { Start-Sleep -Seconds 5; continue }
              if ($raw -match '"ok":true') { Write-Output '免安装版冒烟通过'; exit 0 }
              Write-Error "免安装版冒烟失败: $raw"; exit 1
            }
            Start-Sleep -Seconds 5
          }
          Write-Error '180 秒内没有结果文件：便携版启动器没能把程序拉起来'
          exit 1

      - name: 安装版冒烟（静默安装 → 跑装好的那个 exe）
        shell: pwsh
        timeout-minutes: 12
        run: |
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1).FullName
          Write-Output "静默安装 $setup"
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 20
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'github-update-watch.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error '静默安装后没找到 github-update-watch.exe'
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name
            exit 1
          }
          Write-Output "装好了：$($exe.FullName)"
          $env:GUW_SMOKE_OUT = "$PWD\smoke-installed.json"
          if (Test-Path $env:GUW_SMOKE_OUT) { Remove-Item $env:GUW_SMOKE_OUT }
          & $exe.FullName --smoke
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $env:GUW_SMOKE_OUT) {
              $raw = Get-Content $env:GUW_SMOKE_OUT -Raw
              Write-Output "结果: $raw"
              if ($raw -match '"phase"') { Start-Sleep -Seconds 5; continue }
              if ($raw -match '"ok":true') { Write-Output '安装版冒烟通过（装完能起来、界面能渲染）'; exit 0 }
              Write-Error "安装版冒烟失败: $raw"; exit 1
            }
            Start-Sleep -Seconds 5
          }
          Write-Error '180 秒内安装版没有写出结果文件'
          exit 1

      - name: 诊断：直接跑未打包的 exe 并捕获输出
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = 'dist\win-unpacked\github-update-watch.exe'
          if (-not (Test-Path $exe)) { Write-Output "没有 $exe，跳过"; exit 0 }
          $env:GUW_SMOKE_OUT = "$PWD\smoke-win.json"
          if (Test-Path $env:GUW_SMOKE_OUT) { Remove-Item $env:GUW_SMOKE_OUT }
          Write-Output "运行 $exe --smoke"
          & $exe --smoke *> win-run.log
          Write-Output "退出码 = $LASTEXITCODE"
          Write-Output '--- stdout/stderr ---'
          if (Test-Path win-run.log) { Get-Content win-run.log -Tail 80 }
          Write-Output '--- smoke 结果文件 ---'
          if (Test-Path $env:GUW_SMOKE_OUT) { Get-Content $env:GUW_SMOKE_OUT } else { Write-Output '(没有生成)' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-unpacked-diagnostic
          path: |
            win-run.log
            smoke-win.json
            dist/win-unpacked/resources/app/**
          if-no-files-found: warn

  smoke-packaged:
    name: 打包产物冒烟（Linux + xvfb，真跑一遍）
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: Electron 运行所需图形库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libasound2t64 \
            || sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libasound2

      - name: 打包 Linux 版（下载 Electron 偶发失败，自动重试一次）
        run: |
          set -o pipefail
          if ! npm run dist:linux 2>&1 | tee "$RUNNER_TEMP/dist-linux.log"; then
            echo "第一次打包失败，重试一次…"
            npm run dist:linux 2>&1 | tee -a "$RUNNER_TEMP/dist-linux.log"
          fi

      - name: 打包失败时输出可读错误（公开 annotation）
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/dist-linux.log" ]; then
            tail -n 30 "$RUNNER_TEMP/dist-linux.log" | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '%' | cut -c1-400)
              echo "::error title=dist:linux::$clean"
            done
          fi

      - name: 把「打包后的可执行文件」跑起来（不是从源码跑）
        run: |
          set -u
          BIN=$(find dist/linux-unpacked -maxdepth 1 -type f -name 'github-update-watch' | head -1)
          echo "打包产物: $BIN"
          ls -lh "$BIN"
          export GUW_SMOKE_OUT="$PWD/smoke-result.json"
          rm -f "$GUW_SMOKE_OUT"
          xvfb-run -a "$BIN" --smoke --no-sandbox &
          for i in $(seq 1 60); do
            if [ -f "$GUW_SMOKE_OUT" ]; then
              echo "结果文件: $(cat "$GUW_SMOKE_OUT")"
              if grep -q '"phase":"starting"' "$GUW_SMOKE_OUT" || grep -q '"phase":"server-up"' "$GUW_SMOKE_OUT"; then
                sleep 4
                continue
              fi
              if grep -q '"ok":true' "$GUW_SMOKE_OUT"; then
                echo "打包产物冒烟通过（能启动、服务起来、界面渲染）"
                exit 0
              fi
              echo "::error::打包产物冒烟失败"
              exit 1
            fi
            sleep 3
          done
          echo "::error::180 秒内没有结果文件：打包后的程序没能启动"
          exit 1

  smoke:
    name: 安卓 release 包冒烟（发布前必过）
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 找出 APK 路径
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: 打开 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 装上 release 包并启动
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-smoke.sh "$APK_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk-smoke-shot
          path: |
            app.png
            logcat.txt
          if-no-files-found: warn

  publish:
    name: 挂到 Release
    needs: [android, desktop, smoke, smoke-packaged]   # 冒烟不过就不发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files

      - name: 整理文件名
        run: |
          set -e
          mkdir -p out
          find files -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.sha256' \) -exec cp {} out/ \;
          ls -lh out/

      - name: 写 Release 说明
        run: |
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows | `GitHubUpdateWatch-Setup-*.exe` | 安装版（可选安装目录） |
          | Windows | `GitHubUpdateWatch-Portable-*.exe` | 免安装，双击即用 |
          | Android | `GitHubUpdateWatch-*.apk` | 手机版（需允许"安装未知来源应用"） |

          ## 功能

          自定义 GitHub 项目列表，记下每个项目当前最新版本作为基线，之后每次检查告诉你**有没有发新版本**。

          - 添加项目支持完整链接 / `owner/repo` / `git@github.com:owner/repo.git`
          - 打开即自动检查所有项目；单独检查或全部检查（并发 3、带进度）
          - 卡片固定显示最近 3 个版本，滚轮 / 滑动查看更早版本（不再点开撑高邻居）
          - 「标记已读」把当前最新版记为基线；无更新时自动禁用并说明原因
          - 搜索、按状态过滤（全部/有更新/无更新/有问题）、深色/浅色主题（图标带 morph 变形）
          - 发现新版本时弹系统通知（桌面走 Web Notification，安卓走原生通知）
          - 可填 GitHub Token 把额度从 60 次/小时提到 5000 次/小时

          ## 三端同一份代码

          界面与检测逻辑来自同一个 `public/github-core.js`：桌面版起本地服务，安卓版用 WebView 直连
          `api.github.com`（数据存本机 localStorage）。所以手机和电脑的功能是一致的。

          > 构建信息：本页文件全部由 GitHub Actions 云端编译（见 `.github/workflows/release.yml`），
          > 安卓包使用仓库固定的 release keystore 签名，从 1.1.1 起可直接覆盖安装；
          > 1.0.x 是临时 debug 签名，首次升级仍需卸载一次。应用内更新会下载新版 APK 并交给系统安装器确认。
          EOF
          cat notes.md

      - name: 创建 Release 并上传三个文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，改为上传/覆盖附件"
            gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GitHub 更新监测 $RELEASE_TAG" \
              --notes-file notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
