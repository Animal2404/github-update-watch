name: release

# 打一个 v* 标签就自动：云端编译 Windows 安装包 / 免安装版 / 安卓 APK，
# 然后把三个文件挂到这个 tag 的 GitHub Release 上。
# 这样别人（和未来的你）直接从 Releases 页面就能下载，不用去翻 Actions artifacts。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.0，必须先存在）'
        required: true

permissions:
  contents: write   # 创建 Release 需要写权限

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: 云端编译 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步网页资源进 APK
        run: node tools/sync-android-assets.mjs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验 APK 内容并改名
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/github-core.js'
          mkdir -p out
          cp "$APK" "out/GitHubUpdateWatch-${VERSION}.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*.apk
          if-no-files-found: error

  desktop:
    name: 云端打包 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: 打包（安装包 + 免安装版）
        run: npm run dist

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: 校验打包内容（EXE 里确实带着界面与服务）
        shell: pwsh
        run: |
          # asar 已关闭（asar:false）——Node 的 ESM 加载器不认 asar 归档，
          # 而桌面壳要 import server.mjs，所以直接把文件摊开更稳。
          $appDir = 'dist\win-unpacked\resources\app'
          if (-not (Test-Path $appDir)) { Write-Error "找不到 $appDir"; exit 1 }
          $missing = @()
          foreach ($f in @('public\index.html', 'public\github-core.js', 'public\vendor\morphicons\dom.js', 'public\vendor\icons.js', 'server.mjs', 'electron\main.mjs')) {
            if (-not (Test-Path (Join-Path $appDir $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) { Write-Error "打包内容缺少: $($missing -join ', ')"; exit 1 }
          Write-Output "Windows 包内容校验通过（界面 + 共享核心 + 服务 + 桌面壳都在）"

      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: dist/*.exe
          if-no-files-found: error

  smoke-packaged:
    name: 打包产物冒烟（Linux + xvfb，真跑一遍）
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: Electron 运行所需图形库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libasound2t64 \
            || sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libasound2

      - name: 打包 Linux 版
        run: npm run dist:linux

      - name: 把「打包后的可执行文件」跑起来（不是从源码跑）
        run: |
          set -u
          BIN=$(find dist/linux-unpacked -maxdepth 1 -type f -name 'github-update-watch' | head -1)
          echo "打包产物: $BIN"
          ls -lh "$BIN"
          export GUW_SMOKE_OUT="$PWD/smoke-result.json"
          rm -f "$GUW_SMOKE_OUT"
          xvfb-run -a "$BIN" --smoke --no-sandbox &
          for i in $(seq 1 60); do
            if [ -f "$GUW_SMOKE_OUT" ]; then
              echo "结果文件: $(cat "$GUW_SMOKE_OUT")"
              if grep -q '"phase":"starting"' "$GUW_SMOKE_OUT" || grep -q '"phase":"server-up"' "$GUW_SMOKE_OUT"; then
                sleep 4
                continue
              fi
              if grep -q '"ok":true' "$GUW_SMOKE_OUT"; then
                echo "打包产物冒烟通过（能启动、服务起来、界面渲染）"
                exit 0
              fi
              echo "::error::打包产物冒烟失败"
              exit 1
            fi
            sleep 3
          done
          echo "::error::180 秒内没有结果文件：打包后的程序没能启动"
          exit 1

  smoke:
    name: 安卓 release 包冒烟（发布前必过）
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 找出 APK 路径
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: 打开 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 装上 release 包并启动
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-smoke.sh "$APK_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk-smoke-shot
          path: |
            app.png
            logcat.txt
          if-no-files-found: warn

  publish:
    name: 挂到 Release
    needs: [android, desktop, smoke, smoke-packaged]   # 冒烟不过就不发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files

      - name: 整理文件名
        run: |
          set -e
          mkdir -p out
          find files -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp {} out/ \;
          ls -lh out/

      - name: 写 Release 说明
        run: |
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows | `GitHubUpdateWatch-Setup-*.exe` | 安装版（可选安装目录） |
          | Windows | `GitHubUpdateWatch-Portable-*.exe` | 免安装，双击即用 |
          | Android | `GitHubUpdateWatch-*.apk` | 手机版（需允许"安装未知来源应用"） |

          ## 功能

          自定义 GitHub 项目列表，记下每个项目当前最新版本作为基线，之后每次检查告诉你**有没有发新版本**。

          - 添加项目支持完整链接 / `owner/repo` / `git@github.com:owner/repo.git`
          - 单独检查或全部检查（并发 3、带进度）、版本历史（最近 10 个 Release）
          - 「标记已读」把当前最新版记为基线；无更新时自动禁用并说明原因
          - 搜索、按状态过滤（全部/有更新/无更新/有问题）、深色/浅色主题（图标带 morph 变形）
          - 发现新版本时弹系统通知（桌面走 Web Notification，安卓走原生通知）
          - 可填 GitHub Token 把额度从 60 次/小时提到 5000 次/小时

          ## 三端同一份代码

          界面与检测逻辑来自同一个 `public/github-core.js`：桌面版起本地服务，安卓版用 WebView 直连
          `api.github.com`（数据存本机 localStorage）。所以手机和电脑的功能是一致的。

          > 构建信息：本页文件全部由 GitHub Actions 云端编译（见 `.github/workflows/release.yml`），
          > 安卓包为 debug 签名，仅供自用体验；正式分发请替换成自己的 keystore。
          EOF
          cat notes.md

      - name: 创建 Release 并上传三个文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，改为上传/覆盖附件"
            gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GitHub 更新监测 $RELEASE_TAG" \
              --notes-file notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
